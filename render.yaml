services:
  - type: web
    name: claridad-digital
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_ADSENSE_ENABLED
        value: "false"
      - key: NEXT_PUBLIC_ADSENSE_CMP_READY
        value: "false"
